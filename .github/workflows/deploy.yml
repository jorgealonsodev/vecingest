name: deploy

# Phase 11 (openspec/changes/m0-foundation/tasks.md, D-M): reuses ci.yml and
# security.yml as `needs` via workflow_call so a build can never start on a
# red pipeline, builds each of the three images, scans the EXACT built
# artifact with Trivy BEFORE it is ever pushed (a vulnerable image must
# never reach GHCR), then publishes sha-<short> and latest on every run to
# main, plus v<semver> on a version tag, with SBOM and provenance
# attestations, and finally triggers the Portainer redeploy webhook.
# `packages: write` is granted only to the job that pushes to GHCR.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: ci (reused)
    uses: ./.github/workflows/ci.yml

  security:
    name: security (reused)
    uses: ./.github/workflows/security.yml

  build-scan-publish:
    name: build, scan, publish (${{ matrix.image }})
    needs: [ci, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, site]
        include:
          - image: api
            dockerfile: api/Dockerfile
          - image: web
            dockerfile: app/Dockerfile.web
          - image: site
            dockerfile: site/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build (local only, unpushed -- this exact artifact gets scanned)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: local/vecingest-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Load-bearing ordering: this step runs BEFORE any push step below,
      # scanning the exact bytes that will be published if it passes.
      - name: Trivy image scan (blocking, HIGH/CRITICAL, BEFORE any push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/vecingest-${{ matrix.image }}:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: advisory image-size report (30 MiB budget, non-blocking)
        run: |
          size=$(docker image inspect local/vecingest-${{ matrix.image }}:scan --format='{{.Size}}')
          mb=$(( size / 1024 / 1024 ))
          echo "### Image size: vecingest-${{ matrix.image }} = ${mb} MiB (advisory budget: 30 MiB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -gt 30 ]; then
            echo "::warning::vecingest-${{ matrix.image }} is ${mb} MiB, over the 30 MiB advisory budget"
          fi

      - name: derive tags and push the SCANNED image (no rebuild)
        id: push
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/vecingest-${{ matrix.image }}"
          SHORT_SHA=$(git rev-parse --short=12 HEAD)

          docker tag "local/vecingest-${{ matrix.image }}:scan" "${IMAGE}:sha-${SHORT_SHA}"
          docker tag "local/vecingest-${{ matrix.image }}:scan" "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${SHORT_SHA}"
          docker push "${IMAGE}:latest"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker tag "local/vecingest-${{ matrix.image }}:scan" "${IMAGE}:${GITHUB_REF_NAME}"
            docker push "${IMAGE}:${GITHUB_REF_NAME}"
          fi

          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:latest" | cut -d'@' -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: generate SBOM (SPDX) for the published image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: local/vecingest-${{ matrix.image }}:scan
          output-file: sbom-${{ matrix.image }}.spdx.json
          format: spdx-json

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.image }}.spdx.json
          push-to-registry: true

  redeploy-webhook:
    name: trigger Portainer redeploy
    needs: [build-scan-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST Portainer stack webhook
        run: |
          curl --fail-with-body -sS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
