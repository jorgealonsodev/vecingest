name: deploy

# Phase 11 (openspec/changes/m0-foundation/tasks.md, D-M) ORIGINALLY built
# each image, scanned the exact built artifact with Trivy BEFORE any push,
# published it to GHCR with SBOM/provenance, and let Portainer pull it.
#
# That is no longer how this deploys (PRD_go.md §8.1.1, explicit operator
# decision): Portainer now BUILDS these same three images ON THE SERVER
# from this repository (docker-compose.yml declares `build:`). This job
# therefore no longer publishes anything Portainer consumes -- it is kept
# as a PRE-MERGE SAFETY NET only: it still builds the same Dockerfiles and
# still runs the same blocking Trivy scan, so a vulnerable base image or
# dependency is caught at merge time, in CI, before anyone notices it in
# the server's own build. It does NOT scan, sign, or gate what Portainer
# actually builds and runs -- there is no scan step between Portainer's
# build and production, no SBOM, no provenance attestation, and no
# immutable `sha-`/`v<semver>` tag to roll back to (rollback is now
# "redeploy an earlier commit", see PRD_go.md §11). No `packages: write`,
# `id-token: write` or `attestations: write` is needed any more: nothing
# here pushes to GHCR.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  # A called reusable workflow's job may never request a broader scope than
  # its caller grants it (GitHub Actions hard-fails the whole run with
  # startup_failure otherwise -- see the `ci`/`security` job permissions
  # below). `pull-requests: read` covers ci.yml's `changes` job (dorny/
  # paths-filter) and `security-events: write` covers security.yml's
  # `gosec`/`semgrep`/`trivy-fs` SARIF uploads.
  pull-requests: read
  security-events: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: ci (reused)
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  security:
    name: security (reused)
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  build-and-scan:
    name: build & scan (${{ matrix.image }}) -- pre-merge safety net, not a deploy gate
    needs: [ci, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, site]
        include:
          - image: api
            dockerfile: api/Dockerfile
          - image: web
            dockerfile: app/Dockerfile.web
            # Same build-arg Portainer passes on the server (docker-compose.yml
            # web.build.args), sourced from a GitHub secret here instead of
            # the stack's environment. Expo inlines it at build time either
            # way, so this only affects what this CI-only image contains --
            # it is never published or run anywhere.
            build_args: |
              EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}
          - image: site
            dockerfile: site/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: build (local only, never pushed -- this artifact is scanned then discarded)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: local/vecingest-${{ matrix.image }}:scan
          build-args: ${{ matrix.build_args || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Catches a vulnerable base image or dependency at merge time. This
      # is NOT the image Portainer builds and runs on the server -- it is
      # a separate build of the same Dockerfile, purely for early warning.
      - name: Trivy image scan (blocking, HIGH/CRITICAL -- pre-merge signal only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/vecingest-${{ matrix.image }}:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: advisory image-size report (30 MiB budget, non-blocking)
        run: |
          size=$(docker image inspect local/vecingest-${{ matrix.image }}:scan --format='{{.Size}}')
          mb=$(( size / 1024 / 1024 ))
          echo "### Image size: vecingest-${{ matrix.image }} = ${mb} MiB (advisory budget: 30 MiB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -gt 30 ]; then
            echo "::warning::vecingest-${{ matrix.image }} is ${mb} MiB, over the 30 MiB advisory budget"
          fi

  redeploy-webhook:
    name: trigger Portainer redeploy
    needs: [build-and-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Portainer's stack has `build:` in docker-compose.yml now, so this
      # webhook no longer triggers a pull -- it triggers a full rebuild on
      # the server from whatever commit is checked out there (PRD §8.1.1).
      - name: POST Portainer stack webhook (now triggers a server-side rebuild, not a pull)
        run: |
          curl --fail-with-body -sS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
