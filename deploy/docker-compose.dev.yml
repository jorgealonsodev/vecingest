# LOCAL-ONLY: this file is never deployed by Portainer and never used in
# staging/production -- see ../docker-compose.yml (repo root) for the
# real Portainer stack.
#
# Local development stack (PRD §7.7): only Postgres runs in Docker here.
# `vecingest serve`/`worker` run on the host via `air` for hot reload and
# connect to this container's published port; the app also runs on the
# host.
#
# Usage: docker compose -f deploy/docker-compose.dev.yml up -d

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vecingest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vecingest-dev}
      POSTGRES_DB: ${POSTGRES_DB:-vecingest}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vecingest_dev_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vecingest} -d ${POSTGRES_DB:-vecingest}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vecingest_dev_db_data:
