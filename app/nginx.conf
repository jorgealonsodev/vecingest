# Served by nginxinc/nginx-unprivileged on port 8080 (D-K): the official
# nginx image starts as root and fails PRD §10.1's non-root container gate,
# so Nginx Proxy Manager must target 8080, not 80.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Expo Router web export is a static SPA-style bundle: unmatched paths
    # fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
