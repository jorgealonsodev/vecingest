# Served by nginxinc/nginx-unprivileged on port 8080 (D-K): the official
# nginx image starts as root and fails PRD §10.1's non-root container gate,
# so Nginx Proxy Manager must target 8080, not 80.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Fingerprinted build output: the filename changes whenever the content
    # does, so it can be cached for a year and never revalidated.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Expo Router web export is a static SPA-style bundle: unmatched paths
    # fall back to index.html for client-side routing.
    #
    # `no-cache` on the HTML is what makes a redeploy actually reach people.
    # Without any Cache-Control header nginx sends only Last-Modified/ETag,
    # and browsers then apply HEURISTIC caching -- they invent a freshness
    # lifetime and serve the stored copy without asking. That is not
    # theoretical here: after a deploy the browser kept an index.html that
    # still pointed at the PREVIOUS hashed bundle, so a fix that was live on
    # the server was invisible in the browser and looked like a failed fix.
    #
    # `no-cache` does not mean "do not store": it means "revalidate before
    # using". Paired with the ETag above, the usual answer is a 304 with an
    # empty body, so the cost is one conditional request per navigation while
    # the megabyte of JavaScript beside it still comes from cache.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
