# Served by nginxinc/nginx-unprivileged on port 8080 (D-K): the official
# nginx image starts as root and fails PRD §10.1's non-root container gate,
# so Nginx Proxy Manager must target 8080, not 80.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Astro emits its fingerprinted assets under /_astro/. The filename
    # changes whenever the content does, so a year of caching is safe and no
    # revalidation is needed. The rule is in place before the first real page
    # exists, so the caching story is correct from the first deploy that has
    # content rather than being discovered later.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # `no-cache` on the HTML is what makes a redeploy actually reach people.
    # With no Cache-Control header at all, nginx sends only Last-Modified and
    # ETag, and browsers then apply HEURISTIC caching: they invent a freshness
    # lifetime and serve the stored copy without asking. That bit this project
    # on app.vecingest.xdev.es, where a deployed fix stayed invisible because
    # the cached HTML still referenced the previous hashed bundle.
    #
    # `no-cache` means "revalidate before using", not "do not store". With the
    # ETag above, the normal answer is a 304 with an empty body.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
