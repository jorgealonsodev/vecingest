packages:
  - "app"
  - "packages/shared"
  - "site"

# CVE-2025-71329 / CVE-2025-71330 (image-size, transitive dev/build-time
# dependency of metro via expo): no fixed version is published upstream.
# Accepted residual risk, recorded in docs/security/threat-model.md.
# Written by `pnpm audit --ignore-unfixable`; do not add a fixable CVE here.
auditConfig:
  ignoreCves:
    - CVE-2025-71330
    - CVE-2025-71329

# GHSA-2883-xcg3-v3hh (js-yaml < 4.3.2, CPU exhaustion on empty merge
# sources). It arrives transitively as
# packages/shared > openapi-typescript > @redocly/openapi-core > js-yaml,
# so it is build-time only and never reaches a shipped artifact -- but it IS
# fixable upstream, and the ignoreCves list above is reserved for CVEs with
# no published fix. Pinned inside 4.x on purpose: js-yaml 5.x is a major
# release that @redocly/openapi-core does not declare support for.
#
# The entries below are the same case: fixable upstream, so they belong here
# and not in ignoreCves. Every one of them is a transitive dev/build-time
# dependency, and every replacement version cleared the minimumReleaseAge
# window below before being pinned (oldest published 2026-09-11, newest
# 2026-09-30).
#
# CVE-2026-102422 (critical): shell-quote `quote()` command injection, via
# app > react-native > react-devtools-core > shell-quote.
#
# CVE-2026-102276 / CVE-2026-102278: brace-expansion denial of service by
# uncontrolled recursion. It arrives on three separate major lines, so it
# needs three range-scoped pins: via babel-jest > babel-plugin-* (1.x),
# openapi-typescript > @redocly/openapi-core (2.x) and expo > @expo/cli >
# glob > minimatch (5.x). The higher patched version of the two CVEs is
# pinned in each range, which covers both.
#
# CVE-2026-87776: compression denial of service, via expo > @expo/cli.
#
# CVE-2026-93749: source-map-js denial of service, via the postcss chain.
overrides:
  js-yaml@>=4.0.0 <4.3.2: "^4.3.2"
  shell-quote@>=1.8.4 <1.11.0: "^1.11.0"
  brace-expansion@>=1.0.0 <1.1.20: "^1.1.20"
  brace-expansion@>=2.0.0 <2.1.6: "^2.1.6"
  brace-expansion@>=4.0.0 <5.0.11: "^5.0.11"
  compression@>=1.0.0 <1.8.2: "^1.8.2"
  source-map-js@>=1.0.0 <1.2.2: "^1.2.2"

# Supply-chain hardening (PRD_go.md 6.1, "Cadena de suministro"; semgrep
# package_managers.pnpm rules, wired blocking in security.yml).
blockExoticSubdeps: true
minimumReleaseAge: 10080 # 7 days, in minutes
trustPolicy: no-downgrade
