    LoginRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LoginRequest.json
          format: uri
          readOnly: true
          type: string
        device_name:
          maxLength: 255
          type: string
        email:
          description: Account email address.
          format: email
          type: string
        password:
          description: Absolute floor is 12; the applicable 12-or-15 rule is enforced dynamically server-side (D-F).
          minLength: 12
          type: string
        platform:
          description: "Determines refresh-token transport: web gets an HttpOnly cookie, ios/android get it in the response body."
          enum:
            - ios
            - android
            - web
          type: string
        totp_code:
          description: Required only for accounts with an active TOTP factor; a 403 AUTH_MFA_REQUIRED response means the account needs one.
          type: string
        turnstile_token:
          type: string
      required:
        - email
        - password
        - platform
      type: object
    LoginResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LoginResponse.json
          format: uri
          readOnly: true
          type: string
        access_token:
          type: string
        csrf_token:
          description: Present only on the cookie (web) transport.
          type: string
        expires_in:
          description: Access-token lifetime in seconds.
          format: int64
          type: integer
        refresh_token:
          description: Present only on the body (native) transport.
          type: string
      required:
        - access_token
        - expires_in
      type: object
