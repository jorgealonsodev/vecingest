          examples:
            - https://example.com/schemas/MFAEnrollResponse.json
          format: uri
          readOnly: true
          type: string
        provisioning_uri:
          description: otpauth:// URI an authenticator app can scan as a QR code.
          type: string
        secret:
          description: Base32-encoded TOTP secret, for manual entry into an authenticator app.
          type: string
      required:
        - secret
        - provisioning_uri
      type: object
    MFAVerifyRequest:
      additionalProperties: false
