        created_at:
          format: date-time
          type: string
        door:
          type: string
        floor:
          type: string
        id:
          type: string
        members:
          items:
            $ref: "#/components/schemas/UnitMemberResponse"
          type:
            - array
            - "null"
        participation_coefficient:
          type: string
        type:
          type: string
        updated_at:
          format: date-time
          type: string
        warnings:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - community_id
        - type
        - created_at
        - updated_at
      type: object
    UnitImportResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UnitImportResponse.json
          format: uri
          readOnly: true
          type: string
        dry_run:
          type: boolean
        imported:
          format: int64
          type: integer
        rows:
          items:
            $ref: "#/components/schemas/UnitImportRowResult"
          type:
            - array
            - "null"
        warnings:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - dry_run
        - imported
        - rows
      type: object
    UnitImportRowResult:
      additionalProperties: false
      properties:
        block:
          type: string
        door:
          type: string
        errors:
          items:
            type: string
          type:
            - array
            - "null"
        floor:
          type: string
        owner_dni_cif:
          type: string
        owner_name:
          type: string
        row:
          format: int64
          type: integer
        type:
          type: string
        unit_id:
          type: string
      required:
        - row
      type: object
    UnitMemberCreateRequest:
      additionalProperties: false
      properties:
        consent_text_version:
          type: string
        electronic_notifications_consent:
          type: boolean
        email:
          format: email
          type: string
        notification_address:
          type: string
        role:
          enum:
            - owner
            - tenant
          type: string
        tenure:
          enum:
            - full_owner
            - bare_owner
            - usufructuary
          type: string
      required:
        - email
        - role
      type: object
    UnitMemberResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UnitMemberResponse.json
          format: uri
          readOnly: true
          type: string
        community_id:
          type: string
        consent_text_version:
          type: string
        created_at:
          format: date-time
          type: string
        electronic_notifications_consent_at:
          format: date-time
          type: string
        id:
          type: string
        notification_address:
          type: string
        role:
          type: string
        tenure:
          type: string
        unit_id:
          type: string
        updated_at:
          format: date-time
          type: string
        user_id:
          type: string
      required:
        - id
        - unit_id
        - community_id
        - user_id
        - role
        - tenure
        - created_at
        - updated_at
      type: object
    UpdateCommunityRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateCommunityRequest.json
          format: uri
          readOnly: true
          type: string
        address:
          maxLength: 255
          type: string
        annual_budget:
          type: string
        cif:
          maxLength: 32
          type: string
        city:
          maxLength: 128
          type: string
        name:
          maxLength: 255
          minLength: 1
          type: string
        parent_community_id:
          format: uuid
          type: string
        postal_code:
          maxLength: 16
          type: string
        province:
          maxLength: 128
          type: string
        reserve_fund:
          type: string
        secretary_is_office:
          type: boolean
      type: object
    UpdateUnitMemberRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateUnitMemberRequest.json
          format: uri
          readOnly: true
          type: string
        consent_text_version:
          type: string
        electronic_notifications_consent:
          type: boolean
        notification_address:
          type: string
        role:
          enum:
            - owner
            - tenant
          type: string
        tenure:
          enum:
            - full_owner
            - bare_owner
            - usufructuary
          type: string
      type: object
info:
  title: Vecingest API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/admin/offices:
    post:
      operationId: createOffice
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfficeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create an office and its first admin user (superadmin only)
      tags:
        - offices
  /v1/auth/accept-invitation:
    post:
      operationId: acceptInvitation
      parameters:
        - in: header
          name: X-Platform
          schema:
            type: string
        - in: header
          name: X-App-Version
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Accept an invitation, creating or linking an account (public, unauthenticated)
      tags:
        - auth
        - invitations
  /v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Request a password reset
      tags:
        - auth
  /v1/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Password login
      tags:
        - auth
  /v1/auth/logout:
    post:
      operationId: logout
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke the current session family
      tags:
        - auth
  /v1/auth/refresh:
    post:
      operationId: refresh
      parameters:
        - in: cookie
          name: vecingest_refresh
          schema:
            $ref: "#/components/schemas/Cookie"
        - in: header
          name: X-CSRF-Token
          schema:
            type: string
        - in: header
          name: Origin
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Rotate the refresh token
      tags:
        - auth
  /v1/auth/refresh/csrf:
    get:
      operationId: refreshCSRF
      parameters:
        - in: cookie
          name: vecingest_refresh
          schema:
            $ref: "#/components/schemas/Cookie"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSRFTokenResponse"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            Cross-Origin-Resource-Policy:
              schema:
                type: string
            Vary:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Restore the CSRF token after a page reload
      tags:
        - auth
  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Complete a password reset
      tags:
        - auth
  /v1/auth/superadmin/login:
    post:
      operationId: superadminLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuperadminLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: TOTP-gated superadmin login
      tags:
        - auth
  /v1/communities:
    get:
      operationId: listMyCommunities
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCommunitiesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List communities reachable through the caller's own membership
      tags:
        - communities
    post:
      operationId: createCommunity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommunityRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a community in the caller's own office
      tags:
        - communities
  /v1/communities/{id}:
    get:
      operationId: getCommunity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityDetailResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a community the caller has a membership tied to
      tags:
        - communities
    patch:
      operationId: updateCommunity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommunityRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a community (admin/admin_staff only)
      tags:
        - communities
  /v1/communities/{id}/invitations:
    get:
      operationId: listInvitations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListInvitationsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a community's invitations (admin/admin_staff only)
      tags:
        - invitations
    post:
      operationId: createInvitation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvitationResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Invite a resident to a community (admin/admin_staff only)
      tags:
        - invitations
  /v1/communities/{id}/units:
    post:
      operationId: createUnit
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUnitRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitCreateResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a unit in a community (admin/admin_staff only)
      tags:
        - units
  /v1/communities/{id}/units/import:
    post:
      operationId: importUnits
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: dry_run
          schema:
            type: boolean
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: application/octet-stream
            schema:
              properties:
                file:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
              required:
                - file
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitImportResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Bulk-import units via CSV (?dry_run=true validates without writing)
      tags:
        - units
  /v1/communities/{id}/units/import/template:
    get:
      operationId: getUnitImportTemplate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Download the unit/owner CSV import template
      tags:
        - units
  /v1/health/live:
    get:
      operationId: healthLive
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness probe
      tags:
        - health
  /v1/health/ready:
    get:
      operationId: healthReady
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Readiness probe
      tags:
        - health
  /v1/invitations/preview:
    post:
      operationId: previewInvitation
      parameters:
        - in: header
          name: X-Platform
          schema:
            type: string
        - in: header
          name: X-App-Version
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewInvitationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewInvitationResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Preview an invitation by token or short code (public, unauthenticated)
      tags:
        - invitations
  /v1/invitations/{id}:
    delete:
      operationId: revokeInvitation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeInvitationResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke an invitation (admin/admin_staff only)
      tags:
        - invitations
  /v1/invitations/{id}/resend:
    post:
      operationId: resendInvitation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendInvitationResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Resend an invitation (admin/admin_staff only)
      tags:
        - invitations
  /v1/me:
    get:
      operationId: getMe
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the caller's own profile
      tags:
        - me
  /v1/me/mfa/enroll:
    post:
      operationId: enrollMFA
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAEnrollResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Start TOTP enrollment for the caller's own account
      tags:
        - mfa
  /v1/me/mfa/verify:
    post:
      operationId: verifyMFA
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAVerifyResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Verify a TOTP code -- completes enrollment on the first call, an ordinary check afterward
      tags:
        - mfa
  /v1/me/sessions:
    get:
      operationId: listMySessions
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the caller's own live sessions
      tags:
        - me
  /v1/me/sessions/{id}:
    delete:
      operationId: revokeMySession
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke one of the caller's own sessions
      tags:
        - me
  /v1/offices/me:
    get:
      operationId: getMyOffices
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOfficesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the caller's own office(s)
      tags:
        - offices
  /v1/offices/me/members:
    get:
      operationId: listMyOfficeMembers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOfficeMembersResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List members of the caller's own office(s)
      tags:
        - offices
    post:
      operationId: addOfficeMember
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOfficeMemberRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeMemberResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add an existing user as admin_staff to the caller's office
      tags:
        - offices
  /v1/units/{unitId}/members:
    get:
      operationId: listUnitMembers
      parameters:
        - in: path
          name: unitId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUnitMembersResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a unit's members (any membership tied to the unit's community)
      tags:
        - units
  /v1/units/{unitId}/members/{memberId}:
    delete:
      operationId: deleteUnitMember
      parameters:
        - in: path
          name: unitId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: memberId
          required: true
          schema:
