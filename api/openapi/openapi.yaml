components:
  schemas:
    AcceptInvitationRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AcceptInvitationRequest.json
          format: uri
          readOnly: true
          type: string
        consent:
          type: boolean
        device_name:
          maxLength: 255
          type: string
        name:
          maxLength: 255
          minLength: 1
          type: string
        password:
          minLength: 12
          type: string
        phone:
          maxLength: 32
          type: string
        platform:
          enum:
            - ios
            - android
            - web
          type: string
        short_code:
          type: string
        token:
          type: string
        totp_code:
          description: Required only when the invited address already has an account with an active TOTP factor; a 403 AUTH_MFA_REQUIRED response means the account needs one.
          type: string
      required:
        - name
        - password
        - consent
        - platform
      type: object
    AddOfficeMemberRequest:
