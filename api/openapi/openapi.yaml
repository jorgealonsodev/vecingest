            - https://example.com/schemas/MFAVerifyResponse.json
          format: uri
          readOnly: true
          type: string
        active:
          type: boolean
        recovery_codes:
          description: Present only on the call that activates TOTP for the first time. Shown exactly once; store them safely.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - active
      type: object
