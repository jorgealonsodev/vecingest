version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema: "migrations/schema"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        overrides:
          # D-money rule: numeric is decimal.Decimal, never float64/float32
          # -- no M0 table carries money, but the override is installed
          # before the first money column exists (design's own framing).
          - db_type: "numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "inet"
            go_type: "net/netip.Addr"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
